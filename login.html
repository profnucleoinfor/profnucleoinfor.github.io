<body class="p-login">
<main id="conteudo-principal" class="login">
  <img src="./assets/icon-192.png" width="84" height="84" alt="NIC Formação">
  <h1>Bem-vindo(a)</h1>
  <p>Identifique-se para acessar o portal do aluno</p>
  <form id="loginForm" autocomplete="off">
    <div class="campo">
      <label for="username">Nome Completo</label>
      <input type="text" id="username" placeholder="Digite seu nome" minlength="2" maxlength="80" autocomplete="name" required>
    </div>
    <div class="campo--duo">
      <div class="campo">
        <label for="diaAula">Dia da Aula</label>
        <select id="diaAula" required>
          <option value="" disabled selected>Escolha</option>
          <option value="Quarta-feira">Quarta-feira</option>
          <option value="Sábado">Sábado</option>
        </select>
      </div>
      <div class="campo">
        <label for="horarioAula">Horário</label>
        <input type="time" id="horarioAula" required>
      </div>
    </div>
    <button type="submit" class="btn-nic">ENTRAR NO PORTAL</button>
  </form>
  <p class="frase" aria-live="off"><span id="typed-text"></span></p>
  <a href="./index.html" class="voltar">← Voltar ao início</a>
</main>
<script type="application/json" id="nic-login">{"frases":["O conhecimento transforma vidas.","Invista em você, invista no seu futuro.","A educação é o caminho para o sucesso."]}</script>
