<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NIC Formação Profissional - Acesso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --fundo: #0f172a;
      --card: #1e293b;
      --azul: #3b82f6;
      --borda: #334155;
      --verdeNIC: #7CAC3C;
      --azulNIC: #043B7B;
    }

    body {
      background-color: var(--fundo);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #fff;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #043B7B 0%, #0f172a 100%);
    }

    .login-box {
      max-width: 420px;
      width: 90%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(15px);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid var(--borda);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .logo {
      max-width: 100px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(124, 172, 60, 0.5));
    }

    .form-label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 5px;
      margin-left: 5px;
    }

    .form-control, .form-select {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--borda);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .form-control:focus, .form-select:focus {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: var(--verdeNIC);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(124, 172, 60, 0.2);
    }

    .btn-glow {
      background: linear-gradient(135deg, #7CAC3C 0%, #043B7B 100%);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      margin-top: 10px;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(124, 172, 60, 0.4);
    }

    .typed-text {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 25px;
      font-style: italic;
      min-height: 40px;
    }

    .voltar {
      margin-top: 20px;
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .voltar:hover {
      color: #7CAC3C;
    }
  </style>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.2.png" />
  <meta property="og:image" content="./assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" /></head>

<body>

<main class="login-box">
  <img src="./assets/icon-192.2.png" class="logo" alt="NIC Formação Profissional" />

  <h1 class="h4 mb-1">Bem-vindo(a)</h1>
  <p class="text-muted mb-4">Identifique-se para acessar sua área de aluno</p>

  <form onsubmit="return validateLogin()" autocomplete="off">
    <label class="form-label">Nome Completo</label>
    <input type="text" id="username" class="form-control" placeholder="Digite seu nome completo" required>

    <div class="row">
      <div class="col-6">
        <label class="form-label">Dia da Aula</label>
        <select id="diaAula" class="form-select" required>
          <option value="" disabled selected>Escolha</option>
          <option value="Quarta-feira">Quarta-feira</option>
          <option value="Sábado">Sábado</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label">Horário</label>
        <input type="time" id="horarioAula" class="form-control" required>
      </div>
    </div>

    <button type="submit" class="btn btn-glow w-100">Entrar no Portal</button>
  </form>

  <div class="typed-text">
    <span id="typed-text"></span>
  </div>

  <a href="./index.html" class="voltar">← Voltar para página inicial</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Texto animado
    if (window.Typed) {
      new Typed('#typed-text', {
        strings: [
          '"O conhecimento transforma vidas."',
          '"Invista em voce, invista no seu futuro."',
          '"A educacao e o caminho para o sucesso."'
        ],
        typeSpeed: 50,
        backSpeed: 30,
        loop: true
      });
    }

    // Recuperar nome salvo para facilitar
    const nomeSalvo = localStorage.getItem("nomeAluno");
    if (nomeSalvo) document.getElementById("username").value = nomeSalvo;
  });

  function validateLogin() {
    const nome = document.getElementById("username").value.trim();
    const dia = document.getElementById("diaAula").value;
    const hora = document.getElementById("horarioAula").value;

    // Salva os dados no navegador (funciona sem banco de dados)
    localStorage.setItem("nomeAluno", nome);
    localStorage.setItem("diaAula", dia);
    localStorage.setItem("horarioAula", hora);

    // Redireciona para a página da área do aluno
    window.location.href = "./dashboard.html";

    return false; // Impede recarregamento
  }
</script>

</body>
</html>
