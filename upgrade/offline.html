<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão | NIC Formação Profissional</title>
  <meta name="description" content="Você está sem conexão com a internet no portal da NIC Formação Profissional.">
  <meta name="theme-color" content="#043B7B">
  <link rel="manifest" href="../manifest.json?v=11">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <style>
    :root { --blue:#043B7B; --dark:#04244C; --green:#7CAC3C; --light:#F4F7FB; --text:#18324f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--light); color:var(--text); font-family:Arial,sans-serif; }
    main { width:min(100%,760px); background:#fff; border:1px solid #dbe3ee; border-radius:20px; padding:clamp(24px,5vw,52px); box-shadow:0 12px 32px rgba(4,59,123,.12); }
    .brand { display:inline-flex; align-items:center; gap:12px; color:var(--dark); text-decoration:none; font-weight:700; margin-bottom:32px; }
    .brand img { width:52px; height:52px; border-radius:12px; }
    .eyebrow { color:var(--green); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { color:var(--dark); font-size:clamp(2rem,6vw,4rem); line-height:1.05; margin:12px 0 20px; }
    p { font-size:1.05rem; line-height:1.6; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    a.button { display:inline-block; padding:13px 18px; border-radius:10px; background:var(--blue); color:#fff; font-weight:700; text-decoration:none; }
    a.button.secondary { background:var(--green); }
    a:focus-visible { outline:3px solid #f0a500; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="../index.html">
      <img src="../assets/icon-192.png" alt="NIC Formação Profissional">
      <span>NIC Formação Profissional</span>
    </a>
    <div class="eyebrow">Sem conexão</div>
    <h1>Você está offline.</h1>
    <p>Verifique sua conexão com a internet. Você ainda pode acessar páginas que já foram salvas no dispositivo.</p>
    <nav aria-label="Atalhos offline">
      <a class="button secondary" href="../index.html">Voltar ao início</a>
      <a class="button" href="../dashboard.html">Área do aluno</a>
      <a class="button" href="../sistema-pontos.html">Sistema de pontos</a>
    </nav>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../service-worker.js'));
    }
  </script>
</body>
</html>
