<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Área do Aluno | NIC Formação Profissional</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --nic-blue:#043B7B;
  --nic-blue-dark:#04244C;
  --nic-green:#A5E44E;
  --nic-green-mid:#7CAC3C;

  --bg-gradient:
    radial-gradient(circle at top, #0b2f6b 0%, #04244C 55%, #021933 100%);

  --text:#ffffff;
  --muted:#cbd5e1;

  --card:rgba(255,255,255,0.92);
  --border:rgba(255,255,255,0.12);
}

/* BASE */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  color:var(--text);

  background:
    var(--bg-gradient),
    url('https://images.unsplash.com/photo-1508780709619-79562169bc64?q=80&w=1600&auto=format&fit=crop');

  background-blend-mode:overlay;
  background-size:cover;
  background-attachment:fixed;
}

/* HEADER */
header{
  background:rgba(4,36,76,0.75);
  backdrop-filter:blur(12px);
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
}

header h1{
  font-size:20px;
  font-weight:800;
  color:#fff;
}

.btn-sair{
  background:rgba(255,255,255,0.1);
  border:1px solid var(--border);
  padding:8px 18px;
  border-radius:25px;
  color:white;
  text-decoration:none;
  transition:.3s;
}

.btn-sair:hover{
  background:#ef4444;
  border-color:#ef4444;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

/* TOPO */
.dashboard-top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:25px;
}

.info-box, .avatar-wrapper{
  background:rgba(255,255,255,0.95);
  color:#04244C;
  border-radius:16px;
  padding:22px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* AVATAR */
.avatar-wrapper{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar-wrapper img{
  width:60px;
  height:60px;
  border-radius:50%;
  border:2px solid var(--nic-green-mid);
}

.fala{
  background:rgba(165,228,78,0.2);
  border-left:4px solid var(--nic-green-mid);
  padding:12px;
  border-radius:10px;
  font-size:14px;
  color:#04244C;
}

/* BOTÃO XP */
.btn-pontos{
  display:block;
  text-align:center;
  background:linear-gradient(135deg,var(--nic-blue),var(--nic-green-mid));
  color:white;
  padding:15px;
  border-radius:12px;
  font-weight:700;
  text-decoration:none;
  margin-bottom:30px;
  transition:.3s;
}

.btn-pontos:hover{
  transform:translateY(-4px);
}

/* GRID */
.modulos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}

/* CARD */
.modulo-card{
  background:rgba(255,255,255,0.95);
  color:#04244C;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
  transition:.3s;
  border:1px solid rgba(255,255,255,0.3);
}

.modulo-card:hover{
  transform:translateY(-6px);
  border-color:var(--nic-green-mid);
}

/* XP */
.xp-badge{
  display:inline-block;
  font-size:12px;
  padding:4px 10px;
  border-radius:20px;
  background:rgba(165,228,78,0.25);
  color:var(--nic-green-mid);
  font-weight:700;
  margin-bottom:10px;
}

/* TITULO */
.modulo-card h3{
  margin-top:6px;
}

/* DESCRIÇÃO (NOVO) */
.modulo-desc{
  margin-top:8px;
  font-size:13px;
  color:#334155;
  line-height:1.4;
  margin-bottom:10px;
}

/* BOTÃO */
.btn-acessar{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--nic-blue);
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.modulo-card:hover .btn-acessar{
  background:var(--nic-green-mid);
}

/* RESPONSIVO */
@media(max-width:768px){
  .dashboard-top{
    grid-template-columns:1fr;
  }
}
</style>

<style>
  .nic-skip-link {
    position: absolute;
    top: -48px;
    left: 12px;
    z-index: 2000;
    padding: 10px 14px;
    border-radius: 8px;
    background: #fff;
    color: #043b7b;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    transition: top .15s ease;
  }
  .nic-skip-link:focus { top: 12px; }
  #conteudo-principal:focus { outline: none; }
</style>

</head>

<body>
<a class="nic-skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

<header aria-label="Cabeçalho do portal">
  <h1>🎓 Área do Aluno - NIC</h1>
  <a href="./index.html" class="btn-sair">SAIR</a>
</header>

<main id="conteudo-principal" class="container">

  <div class="dashboard-top">

    <div class="info-box">
      👤 <strong id="nomeAluno"></strong><br><br>
      📅 <span id="diaAula"></span><br>
      ⏰ <span id="horarioAula"></span>
    </div>

    <div class="avatar-wrapper">
      <img src="./assets/icon-192.png" alt="NIC">
      <div class="fala" id="frase">
        Preparado para evoluir com a gente!
      </div>
    </div>

  </div>

  <a href="./sistema-pontos.html" class="btn-pontos">
    🏅 Sistema de Pontos
  </a>

  <div class="modulos-grid" id="gridModulos"></div>

</div>

</main>

<script src="./assets/js/senhas.js" defer></script>
<script src="./assets/js/dashboard.js" defer></script>
<script src="./assets/js/navegacao.js" defer></script>

</body>
</html>
