<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Área do Aluno | NIC Formação Profissional</title>

<!-- ✅ CONFIGURAÇÕES PARA FUNCIONAR COMO APP (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIC Aluno">
<link rel="apple-touch-icon" href="https://i.ibb.co/NdNrybj2/drive.webp">
<meta name="theme-color" content="#043B7B">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="https://i.ibb.co/nLPy4WY/Imagem2.png">

<style>
:root{
  --fundo:#0f172a;
  --card:#1e293b;
  --borda:#334155;
  --texto:#f1f5f9;
  --texto-sec:#94a3b8;
  --azul:#043B7B;         /* Cor NIC - Azul Escuro */
  --azul-hover:#09448C;  /* Cor NIC - Azul Médio */
  --verde:#7CAC3C;       /* Cor NIC - Verde */
  --verde-claro:#A5E44E; /* Cor NIC - Verde Claro */
  --ouro:#fbbf24;        /* Cor para XP/Pontos */
  --gradiente:linear-gradient(135deg,#043B7B,#7CAC3C); /* Gradiente NIC */
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--fundo);
  color:var(--texto);
  line-height: 1.6;
}

header{
  background:#1e293be0;
  backdrop-filter:blur(10px);
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--borda);
  position:sticky; top:0; z-index: 100;
}

header h1 {
  background: var(--gradiente);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

.btn-sair{
  background:rgba(255,255,255,0.1);
  color:#fff;
  padding:8px 22px;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
  border: 1px solid var(--borda);
}
.btn-sair:hover{background:#ef4444; border-color:#ef4444;}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

.dashboard-top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.info-box, .avatar-wrapper{
  background:var(--card);
  border:1px solid var(--borda);
  border-radius:16px;
  padding:22px;
}

.info-box strong {
  color: var(--verde-claro);
  font-size: 1.1rem;
}

.avatar-wrapper{
  display:flex;
  align-items:center;
  gap:18px;
}

.avatar-wrapper img{
  width:64px;height:64px;border-radius:50%;
  border: 2px solid var(--verde);
  box-shadow: 0 0 12px rgba(124, 172, 60, 0.4);
}

.fala{
  background:#334155;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  transition: opacity 0.4s ease;
  border-left: 3px solid var(--verde);
}

.btn-pontos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:16px;
  background:var(--gradiente);
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  font-weight:700;
  margin-bottom:40px;
  transition:.3s;
  box-shadow: 0 4px 15px rgba(4, 59, 123, 0.3);
}
.btn-pontos:hover{transform:translateY(-3px); box-shadow: 0 6px 20px rgba(4, 59, 123, 0.4);}

.modulos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:25px;
}

.modulo-card{
  background:var(--card);
  border:1px solid var(--borda);
  border-radius:16px;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.25s;
  position: relative;
  overflow: hidden;
}

.modulo-card::before {
    content: "MÓDULO";
    position: absolute;
    top: 10px;
    right: -20px;
    background: var(--verde);
    font-size: 10px;
    padding: 2px 25px;
    transform: rotate(45deg);
    color: #fff;
    font-weight: 600;
}

.modulo-card:hover{
  transform:translateY(-6px);
  border-color:var(--verde);
  box-shadow: 0 10px 30px rgba(124, 172, 60, 0.2);
}

.xp-badge {
    background: rgba(251, 191, 36, 0.1);
    color: var(--ouro);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 10px;
    border: 1px solid rgba(251, 191, 36, 0.3);
}

.modulo-card h2{margin-bottom:8px; font-size: 1.3rem; color: #fff;}
.modulo-card p{color:var(--texto-sec);font-size:14px; margin-bottom: 15px;}

.btn-acessar{
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--borda);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition: .3s;
}
.modulo-card:hover .btn-acessar{background:var(--verde); box-shadow: 0 4px 12px rgba(124, 172, 60, 0.3);}

.professor-section{
  margin-top:40px;
  padding:30px;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border: 1px dashed var(--verde);
  border-radius:20px;
  text-align:center;
}

.professor-section h3 {
  color: var(--verde-claro);
}

.foto-prof {
  border-radius: 50%;
  border: 3px solid var(--azul);
  margin-bottom: 15px;
  box-shadow: 0 0 15px rgba(4, 59, 123, 0.3);
}

@media(max-width:768px){
  .dashboard-top{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>🎓 Área do Aluno - NIC</h1>
  <a href="index.html" class="btn-sair" id="btnSair">SAIR</a>
</header>

<div class="container">

<div class="dashboard-top">
  <div class="info-box">
    👤 <strong id="nomeAluno"></strong><br><br>
    📅 <span id="diaAula"></span><br>
    ⏰ <span id="horarioAula"></span>
  </div>

  <div class="avatar-wrapper">
    <img src="https://i.ibb.co/NdNrybj2/drive.webp" alt="Logo NIC">
    <div class="fala" id="frase">Preparado para evoluir com a gente!</div>
  </div>
</div>

<a href="sistema-pontos.html" class="btn-pontos">🏅 Sistema de Pontos</a>

<div class="modulos-grid" id="gridModulos"></div>

<div class="professor-section">
    <img src="https://i.ibb.co/NdNrybj2/drive.webp" width="100" alt="Elinaldo Junior" class="foto-prof">
    <div class="professor-text">
      <h3>👨‍🏫 Seu Instrutor</h3>
      <p>Olá! Sou <strong>Elinaldo Junior</strong>. Meu objetivo é garantir que você aprenda tecnologia de forma humanizada.</p>
      <a class="linkedin-icon" href="https://www.linkedin.com/in/elinaldo-junior-389bb911b" target="_blank">
       <center> <img src="https://i.ibb.co/rRv0hwK7/meu-linkedin-156-1.webp" alt="LinkedIn" width="150"></center>
      </a>
    </div>
  </div>

</div>

<footer style="text-align:center;padding:40px;color:#94a3b8; font-size: 14px;">
© 2026 Núcleo Infor - Formação Profissional | Todos os direitos reservados
</footer>

<script>
/* ✅ REGISTRO DO SERVICE WORKER PARA O APP */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}

/* DADOS DO LOCALSTORAGE - Vem da página de login */
document.getElementById("nomeAluno").innerText = localStorage.getItem("nomeAluno") || "Estudante";
document.getElementById("diaAula").innerText = "Dia da aula: " + (localStorage.getItem("diaAula") || "A definir");
document.getElementById("horarioAula").innerText = "Horário: " + (localStorage.getItem("horarioAula") || "A definir");

/* FUNÇÃO PARA LIMPAR DADOS AO SAIR */
document.getElementById("btnSair").addEventListener("click", function(e){
  e.preventDefault(); // Impede o comportamento padrão do link
  localStorage.clear(); // Apaga TODOS os dados salvos do aluno
  window.location.href = "index.html"; // Volta para página inicial
});

/* FRASES MOTIVACIONAIS DA NIC */
const frases=[
"Conhecimento que transforma o seu futuro.",
"A educação é o melhor investimento.",
"Você está no caminho certo para o sucesso!",
"A tecnologia abre todas as portas.",
"Aprenda, pratique, evolua.",
"Núcleo Infor: sua melhor escolha em ensino."
];

let currentFrase=0;
const fraseElement = document.getElementById("frase");

setInterval(()=>{
  fraseElement.style.opacity=0;
  setTimeout(()=>{
    fraseElement.innerText = frases[currentFrase];
    fraseElement.style.opacity=1;
    currentFrase = (currentFrase + 1) % frases.length;
  },400);
},6000);

/* LISTA DE MÓDULOS - APENAS OS DE INFORMÁTICA (Removido Inglês e Gestão) */
const MODULOS = [
  {titulo:"🖥️ Windows + Linux", senha:"windowslinux", pagina:"windows.html", desc:"Aprenda a usar os principais sistemas operacionais do mercado.", xp: "1000 XP"},
  {titulo:"📝 Word + Digitação", senha:"worddigitacao", pagina:"word.html", desc:"Documentos profissionais e digitação rápida e correta.", xp: "1120 XP"},
  {titulo:"📊 Excel", senha:"excel", pagina:"excel.html", desc:"Planilhas, cálculos, fórmulas e automação de tarefas.", xp: "1200 XP"},
  {titulo:"📽️ PowerPoint", senha:"powerpoint", pagina:"powerpoint.html", desc:"Apresentações incríveis que impressionam qualquer público.", xp: "600 XP"},
  {titulo:"🌐 Internet e Redes Sociais", senha:"internet", pagina:"internet.html", desc:"Navegação segura, pesquisa e uso profissional das redes.", xp: "320 XP"},
  {titulo:"🎨 Canva e Design", senha:"canva", pagina:"canva.html", desc:"Criação de artes, posts e materiais visuais profissionais.", xp: "360 XP"},
  {titulo:"🤖 Inteligência Artificial", senha:"ia", pagina:"ia.html", desc:"Como usar a IA para aumentar sua produtividade e aprendizado.", xp: "800 XP"}
];

const grid = document.getElementById("gridModulos");

MODULOS.forEach(mod=>{
  grid.innerHTML += `
    <div class="modulo-card">
      <div>
        <span class="xp-badge">💎 ${mod.xp}</span>
        <h2>${mod.titulo}</h2>
        <p>${mod.desc}</p>
      </div>
      <button class="btn-acessar" onclick="acessarModulo('${mod.senha}','${mod.pagina}')">
        Entrar na Aula
      </button>
    </div>
  `;
});

/* SISTEMA DE SENHA PARA CADA MÓDULO */
function acessarModulo(senhaCorreta,pagina){
  const entrada = prompt("🔒 Digite a senha da aula:");
  
  if(!entrada) return;

  if(entrada.trim().toLowerCase() === senhaCorreta.toLowerCase()){
    window.location.href = pagina;
  }else{
    alert("❌ Senha incorreta! Procure o instrutor para ajuda.");
  }
}
</script>

</body>
</html>
