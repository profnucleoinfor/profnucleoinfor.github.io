<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Visualizador de Aula | NIC Formação Profissional</title>
<meta name="theme-color" content="#043B7B">
<link rel="manifest" href="./manifest.json?v=21.1">
<link rel="icon" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://drive.google.com">
<style>
:root{--azul:#043B7B;--verde:#7CAC3C;--fundo:#0f172a;--card:#1e293b;--borda:#334155;--texto:#f8fafc;--texto-sec:#94a3b8;--erro:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--fundo);color:var(--texto);font-family:Inter,Segoe UI,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
header{height:auto;min-height:68px;background:rgba(30,41,59,.97);border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:14px;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:38px;height:38px;border-radius:9px;flex-shrink:0}.brand h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-shrink:0}button,a{font:inherit;text-decoration:none;color:var(--texto);background:#253247;border:1px solid var(--borda);border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:600;white-space:nowrap}button:hover,a:hover{border-color:var(--verde);color:#d9f99d}
main{flex:1;min-height:0;display:flex;padding:12px;padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.viewer{position:relative;flex:1;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;background:#020617;border:1px solid var(--borda);border-radius:14px}.viewer.fullscreen-active{border:0;border-radius:0}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.loading,.portrait-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:20}.loading{gap:13px;background:#020617}.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--verde);border-radius:50%;animation:girar 1s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}
.portrait-overlay{background:rgba(2,6,23,.96);gap:14px}.portrait-overlay[hidden]{display:none}.phone-icon{font-size:3.4rem;line-height:1}.portrait-overlay strong{font-size:1.2rem}.portrait-overlay p{max-width:420px;color:var(--texto-sec);line-height:1.5}.portrait-overlay button{background:var(--verde);border-color:var(--verde);color:#102000}.portrait-overlay small{color:var(--texto-sec);max-width:430px}
.error{height:100%;display:flex;justify-content:center;align-items:center;text-align:center;padding:30px;overflow:auto}.error strong{display:block;margin-bottom:10px;font-size:1.2rem;color:#fff}.error p{color:#cbd5e1;line-height:1.5}
@media(max-width:900px) and (orientation:landscape){header{min-height:50px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top))}.brand img{width:30px;height:30px}.brand h1{font-size:.9rem}button,a{padding:6px 9px;font-size:.8rem}main{padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
@media(max-width:700px) and (orientation:portrait){header{flex-wrap:wrap}.brand{width:100%}.actions{width:100%}.actions button,.actions a{flex:1;text-align:center}.brand h1{font-size:.98rem}}
</style>
  <script src="./assets/js/pwa.js" defer></script>
</head>
<body>
<header>
  <div class="brand"><img src="./assets/icon-192.png" alt="NIC"><h1 id="pageTitle">Visualizador de Aula</h1></div>
  <div class="actions">
    <button id="fullscreenBtn" type="button">⤢ Tela cheia</button>
    <button id="backBtn" type="button">⬅ Voltar</button>
    <a id="externalLink" href="#" target="_blank" rel="noopener noreferrer">↗ Abrir fora</a>
  </div>
</header>
<main>
  <section class="viewer" id="viewer">
    <div class="loading" id="loading"><div class="spinner"></div><span>Carregando material...</span></div>
    <div class="portrait-overlay" id="portraitOverlay" hidden>
      <div class="phone-icon" aria-hidden="true">📱↔️</div>
      <strong>Para ver os slides melhor, gire o celular</strong>
      <p>O material foi preparado em formato horizontal. Entre em tela cheia para aproveitar melhor a largura dos slides.</p>
      <button id="rotateBtn" type="button">⤢ Tela cheia + horizontal</button>
      <small>Se o aparelho não permitir rotação automática, gire o celular manualmente.</small>
    </div>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search);
const rawUrl=params.get('url')||'';
const title=params.get('titulo')||'Visualizador de Aula';
const viewer=document.getElementById('viewer');
const pageTitle=document.getElementById('pageTitle');
const externalLink=document.getElementById('externalLink');
const loading=document.getElementById('loading');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const portraitOverlay=document.getElementById('portraitOverlay');
const rotateBtn=document.getElementById('rotateBtn');
let iframe=null;

pageTitle.textContent=title;
document.title=title+' | NIC Formação Profissional';

const dominiosPermitidos=['docs.google.com','drive.google.com'];
function validarUrl(url){try{const u=new URL(url);return u.protocol==='https:'&&dominiosPermitidos.some(d=>u.hostname===d||u.hostname.endsWith('.'+d));}catch{return false}}
function converterUrl(url){
  let m=url.match(/docs\.google\.com\/presentation\/d\/([^/]+)/);if(m)return 'https://docs.google.com/presentation/d/'+m[1]+'/preview';
  m=url.match(/docs\.google\.com\/document\/d\/([^/]+)/);if(m)return 'https://docs.google.com/document/d/'+m[1]+'/preview';
  m=url.match(/docs\.google\.com\/spreadsheets\/d\/([^/]+)/);if(m)return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/htmlembed';
  m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);if(m)return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}
function esconderLoading(){loading.hidden=true}
function mostrarErro(titulo,mensagem){
  esconderLoading();
  portraitOverlay.hidden=true;
  viewer.replaceChildren();
  const box=document.createElement('div');box.className='error';
  const content=document.createElement('div');
  const strong=document.createElement('strong');strong.textContent=titulo;
  const p=document.createElement('p');p.textContent=mensagem;
  content.append(strong,p);box.appendChild(content);viewer.appendChild(box);
  fullscreenBtn.hidden=true;
}
function ehMobile(){return window.matchMedia('(max-width: 900px)').matches}
function estaRetrato(){return window.matchMedia('(orientation: portrait)').matches}
function atualizarOrientacao(){
  if(!ehMobile()){portraitOverlay.hidden=true;return}
  portraitOverlay.hidden=!estaRetrato();
}
async function bloquearPaisagem(){
  try{if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch{}
}
async function liberarOrientacao(){
  try{if(screen.orientation?.unlock)screen.orientation.unlock()}catch{}
}
async function entrarTelaCheia(){
  const request=viewer.requestFullscreen||viewer.webkitRequestFullscreen;
  if(!request)return false;
  try{await request.call(viewer);await bloquearPaisagem();return true}catch{return false}
}
async function alternarFullscreen(){
  const ativo=document.fullscreenElement||document.webkitFullscreenElement;
  if(ativo){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document).catch(()=>{});return}
  await entrarTelaCheia();
}

fullscreenBtn.addEventListener('click',alternarFullscreen);
rotateBtn.addEventListener('click',async()=>{const entrou=await entrarTelaCheia();if(!entrou){portraitOverlay.hidden=false;alert('Seu navegador não permitiu a rotação automática. Gire o celular manualmente para a posição horizontal.')}});

document.addEventListener('fullscreenchange',async()=>{const ativo=!!document.fullscreenElement;viewer.classList.toggle('fullscreen-active',ativo);fullscreenBtn.textContent=ativo?'⤡ Sair da tela cheia':'⤢ Tela cheia';if(ativo)await bloquearPaisagem();else await liberarOrientacao();atualizarOrientacao()});
document.addEventListener('webkitfullscreenchange',()=>{const ativo=!!document.webkitFullscreenElement;viewer.classList.toggle('fullscreen-active',ativo);fullscreenBtn.textContent=ativo?'⤡ Sair da tela cheia':'⤢ Tela cheia';atualizarOrientacao()});
window.addEventListener('resize',atualizarOrientacao);
window.addEventListener('orientationchange',()=>setTimeout(atualizarOrientacao,200));

document.getElementById('backBtn').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='./dashboard.html'});

if(!rawUrl){externalLink.hidden=true;mostrarErro('Conteúdo não encontrado','Nenhuma aula foi informada.')}else if(!validarUrl(rawUrl)){externalLink.hidden=true;mostrarErro('Conteúdo não permitido','Somente arquivos HTTPS do Google Drive e Google Docs são aceitos.')}else{
  externalLink.href=rawUrl;
  iframe=document.createElement('iframe');iframe.src=converterUrl(rawUrl);iframe.title=title;iframe.allow='fullscreen';iframe.allowFullscreen=true;
  iframe.addEventListener('load',esconderLoading,{once:true});
  iframe.addEventListener('error',()=>mostrarErro('Falha ao carregar','Não foi possível abrir este conteúdo.'));
  viewer.appendChild(iframe);
  setTimeout(esconderLoading,6000);
  atualizarOrientacao();
}

if(!(viewer.requestFullscreen||viewer.webkitRequestFullscreen))fullscreenBtn.hidden=true;

</script>
</body>
</html>
