<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador de Aula | NIC Formação Profissional</title>
  <meta name="theme-color" content="#043B7B" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <meta property="og:image" content="./assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --fundo: #0f172a;
      --card: #1e293b;
      --borda: #334155;
      --texto: #f8fafc;
      --texto-sec: #94a3b8;
      --verde: #7CAC3C;
      --azul: #043B7B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--fundo);
      color: var(--texto);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(30, 41, 59, 0.92);
      border-bottom: 1px solid var(--borda);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
    }

    h1 {
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      margin: 0;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    a, button {
      color: var(--texto);
      text-decoration: none;
      border: 1px solid var(--borda);
      background: #253247;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font: inherit;
      font-size: 0.92rem;
    }

    a:hover, button:hover {
      border-color: var(--verde);
      color: #d9f99d;
    }

    main {
      flex: 1;
      padding: 16px;
      display: flex;
      min-height: 0;
    }

    .viewer {
      width: 100%;
      min-height: calc(100vh - 94px);
      border: 1px solid var(--borda);
      border-radius: 16px;
      overflow: hidden;
      background: #020617;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 96px);
      border: 0;
      display: block;
      background: #020617;
    }

    .empty {
      height: 100%;
      min-height: calc(100vh - 96px);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
      color: var(--texto-sec);
    }

    .empty strong {
      display: block;
      color: var(--texto);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    @media (max-width: 700px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .actions a, .actions button {
        flex: 1;
        text-align: center;
      }

      main { padding: 10px; }
      .viewer, iframe, .empty { min-height: calc(100vh - 150px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./assets/icon-192.png" alt="NIC" />
      <h1 id="pageTitle">Visualizador de Aula</h1>
    </div>

    <div class="actions">
      <button type="button" id="backBtn">Voltar</button>
      <a id="externalLink" href="#" target="_blank" rel="noopener noreferrer">Abrir fora</a>
    </div>
  </header>

  <main>
    <section class="viewer" id="viewer"></section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawUrl = params.get('url') || '';
    const title = params.get('titulo') || 'Visualizador de Aula';
    const pageTitle = document.getElementById('pageTitle');
    const externalLink = document.getElementById('externalLink');
    const viewer = document.getElementById('viewer');

    pageTitle.textContent = title;
    document.title = `${title} | NIC Formação Profissional`;

    function toEmbeddableUrl(url) {
      const match = url.match(/docs\.google\.com\/presentation\/d\/([^/]+)/);
      if (match) {
        return `https://docs.google.com/presentation/d/${match[1]}/embed?start=false&loop=false&delayms=3000`;
      }

      return url;
    }

    if (rawUrl) {
      externalLink.href = rawUrl;
      const iframe = document.createElement('iframe');
      iframe.src = toEmbeddableUrl(rawUrl);
      iframe.allowFullscreen = true;
      iframe.loading = 'eager';
      iframe.title = title;
      viewer.appendChild(iframe);
    } else {
      externalLink.style.display = 'none';
      viewer.innerHTML = '<div class="empty"><div><strong>Conteúdo não encontrado</strong>Volte ao painel e escolha uma aula disponível.</div></div>';
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = './dashboard.html';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</body>
</html>
