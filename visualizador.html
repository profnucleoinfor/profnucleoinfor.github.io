<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visualizador de Aula | NIC Formação Profissional</title>

<meta name="theme-color" content="#043B7B">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">

<!-- Otimização de conexão -->
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://drive.google.com">
<link rel="dns-prefetch" href="//docs.google.com">
<link rel="dns-prefetch" href="//drive.google.com">

<style>
:root{
  --azul:#043B7B;
  --verde:#7CAC3C;
  --fundo:#0f172a;
  --card:#1e293b;
  --borda:#334155;
  --texto:#f8fafc;
  --texto-sec:#94a3b8;
  --erro:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  height:100%;
  overflow:hidden;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--fundo);
  color:var(--texto);
}

body{
  display:flex;
  flex-direction:column;
}

header{
  background:rgba(30,41,59,.96);
  border-bottom:1px solid var(--borda);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  gap:16px;
  flex-shrink:0;
  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand img{
  width:42px;
  height:42px;
  border-radius:10px;
}

.brand h1{
  font-size:1.15rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.actions{
  display:flex;
  gap:10px;
}

button,
a{
  text-decoration:none;
  color:var(--texto);
  background:#253247;
  border:1px solid var(--borda);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}

button:hover,
a:hover{
  border-color:var(--verde);
  color:#d9f99d;
}

main{
  flex:1;
  padding:16px;
  overflow:hidden;
}

.viewer{
  width:100%;
  height:100%;
  border-radius:16px;
  border:1px solid var(--borda);
  overflow:hidden;
  background:#020617;
  position:relative;
}

iframe{
  width:100%;
  height:100%;
  border:none;
  background:white;
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
  background:#020617;
  z-index:10;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid rgba(255,255,255,.15);
  border-top-color:var(--verde);
  border-radius:50%;
  animation:girar 1s linear infinite;
}

@keyframes girar{
  to{
    transform:rotate(360deg);
  }
}

.error{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  color:var(--erro);
}

.error strong{
  display:block;
  margin-bottom:10px;
  font-size:1.2rem;
  color:white;
}

@media(max-width:700px){

  header{
    flex-direction:column;
    align-items:stretch;
  }

  .actions{
    width:100%;
  }

  .actions button,
  .actions a{
    flex:1;
    text-align:center;
  }

  .brand h1{
    font-size:1rem;
  }

}
</style>
</head>

<body>

<header>

  <div class="brand">
    <img src="/assets/icon-192.png" alt="NIC">
    <h1 id="pageTitle">Visualizador de Aula</h1>
  </div>

  <div class="actions">
    <button id="backBtn">⬅ Voltar</button>

    <a
      id="externalLink"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      ↗ Abrir Fora
    </a>
  </div>

</header>

<main>

  <section class="viewer" id="viewer">

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Carregando material...</span>
    </div>

  </section>

</main>

<script>

const params = new URLSearchParams(window.location.search);

const rawUrl = params.get('url') || '';
const title = params.get('titulo') || 'Visualizador de Aula';

const viewer = document.getElementById('viewer');
const pageTitle = document.getElementById('pageTitle');
const externalLink = document.getElementById('externalLink');
const loading = document.getElementById('loading');

pageTitle.textContent = title;
document.title = `${title} | NIC Formação Profissional`;

const dominiosPermitidos = [
  'docs.google.com',
  'drive.google.com'
];

function validarUrl(url){

  try{

    const u = new URL(url);

    return dominiosPermitidos.some(
      dominio =>
      u.hostname === dominio ||
      u.hostname.endsWith('.' + dominio)
    );

  }catch{
    return false;
  }

}

function converterUrl(url){

  const slides = url.match(
    /docs\.google\.com\/presentation\/d\/([^/]+)/
  );

  if(slides){
    return `https://docs.google.com/presentation/d/${slides[1]}/preview`;
  }

  const documento = url.match(
    /docs\.google\.com\/document\/d\/([^/]+)/
  );

  if(documento){
    return `https://docs.google.com/document/d/${documento[1]}/preview`;
  }

  const planilha = url.match(
    /docs\.google\.com\/spreadsheets\/d\/([^/]+)/
  );

  if(planilha){
    return `https://docs.google.com/spreadsheets/d/${planilha[1]}/htmlembed`;
  }

  const drive = url.match(
    /drive\.google\.com\/file\/d\/([^/]+)/
  );

  if(drive){
    return `https://drive.google.com/file/d/${drive[1]}/preview`;
  }

  return url;
}

function esconderLoading(){
  if(loading){
    loading.style.display = 'none';
  }
}

function mostrarErro(titulo,mensagem){

  esconderLoading();

  viewer.innerHTML = `
    <div class="error">
      <div>
        <strong>${titulo}</strong>
        <p>${mensagem}</p>
      </div>
    </div>
  `;

}

if(!rawUrl){

  externalLink.style.display = 'none';

  mostrarErro(
    'Conteúdo não encontrado',
    'Nenhuma aula foi informada.'
  );

}else if(!validarUrl(rawUrl)){

  externalLink.style.display = 'none';

  mostrarErro(
    'Conteúdo não permitido',
    'Somente arquivos do Google Drive e Google Docs são aceitos.'
  );

}else{

  externalLink.href = rawUrl;

  const iframe = document.createElement('iframe');

  iframe.src = converterUrl(rawUrl);
  iframe.title = title;

  iframe.allow =
    'fullscreen';

  iframe.allowFullscreen = true;

  iframe.onload = () => {
    esconderLoading();
  };

  iframe.onerror = () => {

    mostrarErro(
      'Falha ao carregar',
      'Não foi possível abrir este conteúdo.'
    );

  };

  viewer.appendChild(iframe);

  /* Segurança contra spinner infinito */
  setTimeout(() => {
    esconderLoading();
  }, 3000);

}

document
.getElementById('backBtn')
.addEventListener('click',()=>{

  if(history.length > 1){
    history.back();
  }else{
    window.location.href = '/dashboard.html';
  }

});

if('serviceWorker' in navigator){

  window.addEventListener('load',()=>{

    navigator.serviceWorker
      .getRegistration()
      .then(reg=>{

        if(!reg){
          navigator.serviceWorker.register('/service-worker.js');
        }

      });

  });

}

</script>

</body>
</html>
